name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP 8.4 / Swoole 6.2
    runs-on: ubuntu-latest
    # 挂住(如进程无法退出)按失败处理,避免无限等待
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate, install, lint, analyse and test
        run: |
          docker run --rm -v "$PWD":/app -w /app registry.cn-hongkong.aliyuncs.com/dleno-server/php:alp324-php84-sw6.2.3 sh -c '
            set -e
            php -v | head -1
            php --ri swoole | grep -i "^version"
            composer validate --strict
            composer update --no-interaction --no-progress --prefer-dist
            find src -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
            composer analyse
            composer test
          '
